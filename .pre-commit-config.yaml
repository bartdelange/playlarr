repos:
  - repo: local
    hooks:
      - id: commit-message
        name: commit message
        entry: node scripts/check-commit-msg.mjs
        language: system
        stages: [commit-msg]
      - id: lint
        name: eslint
        entry: npm run lint
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: unit-tests
        name: unit tests
        entry: npm test
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: production-build
        name: production build
        entry: npm run build
        language: system
        pass_filenames: false
        stages: [pre-push]
