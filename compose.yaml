services:
  playlarr:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      DATA_DIR: /config/data
      OUTPUT_DIR: /playlists
      TIDAL_SESSION_FILE: /config/secrets/tidal-session.json
      SPOTIFY_TOKEN_CACHE: /config/secrets/spotify-token.json
      TZ: ${TZ:-UTC}
      MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT:?set this in .env}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-http://127.0.0.1:8787/callback}
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      LIDARR_ROOT_FOLDER: ${LIDARR_ROOT_FOLDER:-/music}
      LIDARR_QUALITY_PROFILE_ID: ${LIDARR_QUALITY_PROFILE_ID:-1}
      LIDARR_METADATA_PROFILE_ID: ${LIDARR_METADATA_PROFILE_ID:-1}
      NAVIDROME_URL: ${NAVIDROME_URL:-}
      NAVIDROME_USERNAME: ${NAVIDROME_USERNAME:-}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
    volumes:
      - ./container-config:/config
      - ./container-playlists:/playlists
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
