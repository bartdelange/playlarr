services:
  music-importer:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      TZ: ${TZ:-UTC}
      MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT:?set this in .env}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-http://127.0.0.1:8765/callback}
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      LIDARR_ROOT_FOLDER: ${LIDARR_ROOT_FOLDER:-/music}
      LIDARR_QUALITY_PROFILE_ID: ${LIDARR_QUALITY_PROFILE_ID:-1}
      LIDARR_METADATA_PROFILE_ID: ${LIDARR_METADATA_PROFILE_ID:-1}
      NAVIDROME_URL: ${NAVIDROME_URL:-}
      NAVIDROME_USERNAME: ${NAVIDROME_USERNAME:-}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
      NAVIDROME_ROOT_FOLDER: ${NAVIDROME_ROOT_FOLDER:-/music}
    volumes:
      - ./container-data:/data
      - ./container-output:/output
      - ./container-secrets:/secrets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
