name: Bug report
description: Report something in Playlarr that is not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Playlarr bug.

        Please provide enough information for the problem to be reproduced.
        Remove API keys, access tokens, passwords, cookies, and other secrets from logs before submitting them.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly and concisely.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Describe the expected behaviour.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Open ...
        2. Import ...
        3. Select ...
        4. Observe ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Spotify
        - TIDAL
        - Lidarr
        - MusicBrainz matching
        - Navidrome
        - Playlist generation / M3U8
        - CSV export
        - Imports / acquisition
        - Authentication
        - Web interface
        - Worker / background processing
        - Database / persistence
        - Docker
        - Unraid
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Playlarr version
      description: Release version, Docker tag, or commit SHA.
      placeholder: e.g. v1.2.3 or abc1234
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker
        - Unraid
        - Local development
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Required only if the issue involves the web interface.
      placeholder: e.g. Firefox 142, Safari 26

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Paste relevant Playlarr logs here.

        Do not include API keys, OAuth tokens, passwords, cookies, session values, or other secrets.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, related issues, unusual configuration, or anything else that may help.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find an existing report for this problem.
          required: true
        - label: I removed passwords, tokens, API keys, cookies, and other secrets from the information above.
          required: true
