name: Validate

on:
  workflow_call:
    inputs:
      release_tag:
        description: Optional semantic-version tag that must match the project version
        required: false
        type: string
        default: ""
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  code-quality: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Validate version tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"release tag must use vMAJOR.MINOR.PATCH, got {tag!r}")

          with Path("pyproject.toml").open("rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(
                  f"release tag {tag!r} does not match pyproject.toml version {version!r}"
              )
          PY
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -ignore 'unknown permission scope "code-quality"'
      - name: Check formatting
        run: uv run ruff format --check src tests scripts
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Test with coverage
        run: uv run coverage run -m unittest discover -s tests -v
      - name: Generate coverage report
        run: uv run coverage xml -o coverage.xml
      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/unittest
      - name: Build package
        run: uv build
