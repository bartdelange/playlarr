name: Validate

on:
  workflow_call:
    inputs:
      release_tag:
        description: Optional semantic-version tag that must match the project version
        required: false
        type: string
        default: ""
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate version tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node - <<'JS'
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
            throw new Error(`release tag must use vMAJOR.MINOR.PATCH, got ${tag}`);
          }
          const version = require("./package.json").version;
          if (tag !== `v${version}`) {
            throw new Error(`release tag ${tag} does not match package.json version ${version}`);
          }
          JS
      - name: Install dependencies
        run: npm ci
      - name: Validate GitHub Actions
        run: npm run actionlint
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Strict typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build application
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end test
        run: npm run test:e2e
