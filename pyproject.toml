[project]
name = "music-importer"
version = "1.1.2"
description = "Import TIDAL or Spotify playlists through MusicBrainz into Lidarr"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "requests>=2.31",
    "spotipy>=2.24",
    "tidalapi>=0.8.8",
    "uvicorn>=0.52.1",
]

[project.scripts]
music-import = "music_importer.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_importer"]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
